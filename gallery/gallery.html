<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Interactive Photo Gallery</h1>

  <!-- Preview area -->
  <div id="image">Hover over an image below to display here.</div>

  <!-- Thumbnails -->
  <div class="gallery">

    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500"
         alt="A beautiful mountain landscape"
         class="preview"
         onmouseover="upDate(this)"
         onmouseout="unDo()">

    <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=500"
         alt="A serene forest path"
         class="preview"
         onmouseover="upDate(this)"
         onmouseout="unDo()">

    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500"
         alt="A calm ocean at sunset"
         class="preview"
         onmouseover="upDate(this)"
         onmouseout="unDo()">

    <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=500"
         alt="A cozy city street at night"
         class="preview"
         onmouseover="upDate(this)"
         onmouseout="unDo()">

    <img src="https://images.unsplash.com/photo-1490750967868-88df5691cc9c?w=500"
         alt="A colourful field of flowers"
         class="preview"
         onmouseover="upDate(this)"
         onmouseout="unDo()">

    <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=500"
         alt="A snowy mountain peak"
         class="preview"
         onmouseover="upDate(this)"
         onmouseout="unDo()">

  </div>

  <script>
    function upDate(previewPic) {
      console.log("upDate triggered");
      console.log("alt:", previewPic.alt);
      console.log("src:", previewPic.src);

      document.getElementById("image").textContent = previewPic.alt;
      document.getElementById("image").style.backgroundImage =
        "url('" + previewPic.src + "')";
    }

    function unDo() {
      document.getElementById("image").style.backgroundImage = "url('')";
      document.getElementById("image").textContent =
        "Hover over an image below to display here.";
    }
  </script>

</body>
</html>
